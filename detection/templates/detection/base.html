{% load static %}
<!doctype html>
<html lang="zh-hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MineWatch 挖矿入侵发现平台{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'detection/css/app.css' %}">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">⛏</span>
      <div>
        <div class="brand-name">MineWatch</div>
        <div class="brand-sub">挖矿入侵发现平台</div>
      </div>
    </div>
    <nav class="nav">
      <a href="{% url 'detection:dashboard' %}"
         class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        <span class="nav-ico">▦</span> 安全总览
      </a>
      <a href="{% url 'detection:incident_list' %}"
         class="nav-item {% if 'incident' in request.resolver_match.url_name %}active{% endif %}">
        <span class="nav-ico">⚠</span> 入侵事件
      </a>
      <a href="{% url 'detection:host_list' %}"
         class="nav-item {% if 'host' in request.resolver_match.url_name %}active{% endif %}">
        <span class="nav-ico">🖥</span> 主机资产
      </a>
      <a href="{% url 'detection:pool_list' %}"
         class="nav-item {% if 'pool' in request.resolver_match.url_name %}active{% endif %}">
        <span class="nav-ico">◎</span> 矿池 IOC 清单
      </a>
      <a href="/admin/" class="nav-item">
        <span class="nav-ico">⚙</span> 后台管理
      </a>
    </nav>
    <div class="sidebar-foot">
      演示环境 · 数据为合成生成<br>检测窗口 48 小时
    </div>
  </aside>

  <main class="main">
    {% if messages %}
      <div class="messages">
        {% for m in messages %}<div class="message {{ m.tags }}">{{ m }}</div>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
